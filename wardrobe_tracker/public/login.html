<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wardrobe">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Sign In — Wardrobe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0c0c0c;--surface:#181818;--border:#2a2a2a;--accent:#5b8df6;--text:#f0f0f0;--muted:#777;--danger:#d94f4f}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:360px}
.logo{font-size:32px;font-weight:800;letter-spacing:-1px;margin-bottom:6px}
.tagline{color:var(--muted);font-size:14px;margin-bottom:32px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--text);font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,141,246,.12)}
.error{color:var(--danger);font-size:14px;margin-bottom:12px;min-height:20px}
.btn{width:100%;padding:14px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px;transition:opacity .15s}
.btn:active{opacity:.8}
.btn:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Wardrobe</div>
  <div class="tagline">Sign in to manage your bags</div>
  <form id="form" autocomplete="on">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="error" id="error"></div>
    <button type="submit" class="btn" id="btn">Sign In</button>
  </form>
</div>
<script>
const next = new URLSearchParams(location.search).get('next') || '/';

// If already logged in, skip login page
fetch('/api/auth/me').then(r => { if (r.ok) location.replace(next); });

// If no users exist, redirect to setup
fetch('/api/setup/needed').then(r => r.json()).then(d => { if (d.needed) location.replace('/setup.html'); });

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('error');
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    if (r.ok) {
      location.replace(next);
    } else {
      const d = await r.json();
      err.textContent = d.error || 'Sign in failed';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  } catch(_) {
    err.textContent = 'Network error — try again';
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
