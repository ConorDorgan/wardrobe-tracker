<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Manage — Wardrobe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c0c0c;--surface:#181818;--surface2:#242424;
  --border:#2a2a2a;--accent:#5b8df6;--text:#f0f0f0;
  --muted:#777;--danger:#d94f4f;--success:#4caf84;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh;max-width:540px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;padding:18px 16px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.back-btn{color:var(--accent);text-decoration:none;font-size:15px;font-weight:500;white-space:nowrap;flex-shrink:0}
h1{font-size:19px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-pill{font-size:12px;color:var(--muted);flex-shrink:0;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;white-space:nowrap}
main{padding:16px 16px 80px}

/* List view */
.add-new{display:flex;align-items:center;gap:10px;padding:14px;background:var(--surface2);border-radius:12px;text-decoration:none;color:var(--accent);font-weight:600;margin-bottom:16px;border:1px solid var(--border);font-size:15px}
.add-new-icon{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;font-weight:300}
.bag-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border-radius:12px;margin-bottom:10px;border:1px solid var(--border)}
.bag-thumb{width:54px;height:54px;border-radius:8px;object-fit:cover;flex-shrink:0}
.bag-thumb-empty{width:54px;height:54px;border-radius:8px;background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted)}
.bag-details{flex:1;min-width:0}
.bag-item-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bag-item-meta{font-size:12px;color:var(--muted);margin-top:2px}
.bag-actions{display:flex;gap:6px;flex-shrink:0}
.btn-sm{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 11px;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center}
.btn-sm.danger{color:var(--danger);border-color:rgba(217,79,79,.35)}
.btn-sm:active{opacity:.7}

/* Users section */
.section{margin-top:28px;padding-top:22px;border-top:1px solid var(--border)}
.section-heading{font-size:16px;font-weight:700;margin-bottom:14px}
.user-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border-radius:12px;margin-bottom:10px;border:1px solid var(--border)}
.user-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;flex-shrink:0}
.user-details{flex:1;min-width:0}
.user-name{font-weight:600;font-size:15px}
.user-meta{font-size:12px;color:var(--muted);margin-top:2px}
.badge{background:rgba(91,141,246,.15);color:var(--accent);border:1px solid rgba(91,141,246,.25);border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600}

/* Form */
.section-title{font-size:18px;font-weight:700;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;font-family:inherit;outline:none;-webkit-appearance:none}
.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,141,246,.12)}
.field textarea{min-height:90px;resize:vertical;line-height:1.55}
.field.checkbox{display:flex;align-items:center;gap:10px;flex-direction:row}
.field.checkbox label{text-transform:none;letter-spacing:0;font-size:14px;margin:0;color:var(--text)}
.field.checkbox input{width:auto;padding:0;border:none;background:none}
.btn-primary{width:100%;padding:14px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-primary:active{opacity:.8}
.btn-primary:disabled{opacity:.5;cursor:default}

/* Photos section */
.photos-section{margin-top:28px;padding-top:22px;border-top:1px solid var(--border)}
.photos-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.photos-title{font-size:16px;font-weight:700}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.photo-wrap{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2)}
.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.photo-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.72);border:none;border-radius:50%;width:24px;height:24px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.upload-label{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:1.5px dashed var(--border);border-radius:10px;color:var(--muted);cursor:pointer;font-size:14px;font-weight:500}
.upload-label:active{border-color:var(--accent);color:var(--accent)}

/* NFC section */
.nfc-section{margin-top:20px;padding:16px;background:var(--surface);border-radius:12px;border:1px solid var(--border)}
.nfc-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.nfc-url{font-size:12px;word-break:break-all;background:var(--surface2);padding:10px 12px;border-radius:8px;margin-bottom:10px;font-family:'Menlo','Courier New',monospace;line-height:1.5;color:rgba(240,240,240,.8)}
.copy-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s}
.copy-btn.copied{background:var(--success)}
.nfc-hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.view-link{display:flex;align-items:center;justify-content:center;margin-top:14px;color:var(--accent);text-decoration:none;font-size:14px;font-weight:500}

/* Change password */
.pw-section{margin-top:20px;padding:16px;background:var(--surface);border-radius:12px;border:1px solid var(--border)}
.pw-section summary{font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.pw-section[open] summary{color:var(--text);margin-bottom:14px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:#2a2a2a;color:#fff;padding:10px 22px;border-radius:24px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;z-index:200;white-space:nowrap;border:1px solid var(--border)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.loading{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
  <a href="/" class="back-btn" id="back-btn">&#8592; Home</a>
  <h1 id="page-title">Manage</h1>
  <div class="user-pill" id="user-pill"></div>
</header>
<main id="main"><div class="loading">Loading...</div></main>
<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept="image/*" multiple style="display:none">
<script>
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

let me = null;

function toast(msg, dur=2600) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), dur);
}

function setHeader(title, backLabel, backAction) {
  document.getElementById('page-title').textContent = title;
  const btn = document.getElementById('back-btn');
  btn.textContent = `← ${backLabel}`;
  if (typeof backAction === 'string') {
    btn.href = backAction;
    btn.onclick = null;
  } else {
    btn.href = '#';
    btn.onclick = e => { e.preventDefault(); navigateTo(''); };
  }
}

function navigateTo(hash) {
  history.pushState(null, '', hash ? `#${hash}` : location.pathname);
  render();
}

async function init() {
  const r = await fetch('/api/auth/me');
  if (!r.ok) { location.replace('/login.html?next=' + encodeURIComponent(location.pathname + location.hash)); return; }
  me = await r.json();
  document.getElementById('user-pill').textContent = me.username;
  render();
}

async function render() {
  if (!me) return;
  const hash = location.hash.slice(1);
  if (hash === 'new') {
    renderForm(null);
  } else if (hash.startsWith('edit-')) {
    await renderFormForBag(hash.replace('edit-', ''));
  } else {
    await renderList();
  }
}

async function renderList() {
  setHeader('Manage Bags', 'Home', '/');
  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">Loading...</div>';
  try {
    const bags = await fetch('/api/bags').then(r => r.json());
    let usersHTML = '';
    if (me.isAdmin) {
      const users = await fetch('/api/users').then(r => r.json());
      usersHTML = renderUsersSection(users);
    }
    main.innerHTML = `
      <a href="#new" class="add-new">
        <div class="add-new-icon">+</div>
        Add New Bag
      </a>
      ${bags.length === 0
        ? '<div class="empty">No bags yet. Create one above.</div>'
        : bags.map(b => `
          <div class="bag-item" id="item-${esc(b.id)}">
            ${b.cover
              ? `<img class="bag-thumb" src="/uploads/${esc(b.cover)}" alt="">`
              : `<div class="bag-thumb-empty">&#128220;</div>`}
            <div class="bag-details">
              <div class="bag-item-name">${esc(b.name)}</div>
              <div class="bag-item-meta">${b.image_count} photo${b.image_count !== 1 ? 's' : ''}${b.location ? ` &middot; ${esc(b.location)}` : ''}</div>
            </div>
            <div class="bag-actions">
              <a href="#edit-${esc(b.id)}" class="btn-sm">Edit</a>
              <button class="btn-sm danger" onclick="deleteBag('${esc(b.id)}','${esc(b.name).replace(/'/g,"\\'")}')">Delete</button>
            </div>
          </div>`).join('')}
      ${usersHTML}
      ${renderPasswordSection()}
    `;
    if (me.isAdmin) setupAddUserForm();
  } catch(e) {
    main.innerHTML = '<div class="empty">Failed to load.</div>';
  }
}

function renderUsersSection(users) {
  return `
    <div class="section">
      <div class="section-heading">Users</div>
      ${users.map(u => `
        <div class="user-item" id="uitem-${esc(u.id)}">
          <div class="user-avatar">${esc(u.username[0].toUpperCase())}</div>
          <div class="user-details">
            <div class="user-name">${esc(u.username)} ${u.is_admin ? '<span class="badge">admin</span>' : ''}</div>
            <div class="user-meta">${u.id === me.id ? 'You' : 'Member'}</div>
          </div>
          ${u.id !== me.id ? `<button class="btn-sm danger" onclick="deleteUser('${esc(u.id)}','${esc(u.username).replace(/'/g,"\\'")}')">Remove</button>` : ''}
        </div>`).join('')}
      <div style="margin-top:16px">
        <div style="font-size:14px;font-weight:600;margin-bottom:12px;color:var(--muted)">Add user</div>
        <form id="add-user-form">
          <div class="field">
            <label>Username</label>
            <input name="username" placeholder="e.g. housemate" autocapitalize="none" autocomplete="off" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" name="password" placeholder="Min 4 characters" autocomplete="new-password" required>
          </div>
          <div class="field checkbox">
            <input type="checkbox" name="isAdmin" id="isAdmin">
            <label for="isAdmin">Admin (can manage users)</label>
          </div>
          <div style="color:var(--danger);font-size:13px;margin-bottom:8px;min-height:18px" id="user-err"></div>
          <button type="submit" class="btn-primary" id="add-user-btn">Add User</button>
        </form>
      </div>
    </div>`;
}

function renderPasswordSection() {
  return `
    <div class="section">
      <details class="pw-section">
        <summary>Change my password</summary>
        <form id="pw-form">
          <div class="field">
            <label>New password</label>
            <input type="password" name="password" placeholder="Min 4 characters" autocomplete="new-password" required>
          </div>
          <div style="color:var(--danger);font-size:13px;margin-bottom:8px;min-height:18px" id="pw-err"></div>
          <button type="submit" class="btn-primary" id="pw-btn">Update Password</button>
        </form>
      </details>
    </div>`;
}

function setupAddUserForm() {
  document.getElementById('add-user-form')?.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('add-user-btn');
    const err = document.getElementById('user-err');
    const fd = new FormData(e.target);
    err.textContent = '';
    btn.disabled = true;
    try {
      const r = await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: fd.get('username'), password: fd.get('password'), isAdmin: fd.get('isAdmin') === 'on' }),
      });
      const d = await r.json();
      if (!r.ok) { err.textContent = d.error; btn.disabled = false; return; }
      toast('User added');
      e.target.reset();
      btn.disabled = false;
      await renderList();
    } catch(_) { err.textContent = 'Network error'; btn.disabled = false; }
  });

  document.getElementById('pw-form')?.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('pw-btn');
    const err = document.getElementById('pw-err');
    const password = new FormData(e.target).get('password');
    err.textContent = '';
    if (password.length < 4) { err.textContent = 'Password must be at least 4 characters'; return; }
    btn.disabled = true;
    try {
      const r = await fetch(`/api/users/${me.id}/password`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      if (!r.ok) { const d = await r.json(); err.textContent = d.error; btn.disabled = false; return; }
      toast('Password updated');
      e.target.reset();
      btn.disabled = false;
    } catch(_) { err.textContent = 'Network error'; btn.disabled = false; }
  });
}

async function deleteUser(id, name) {
  if (!confirm(`Remove user "${name}"?\n\nTheir bags will remain in the database.`)) return;
  try {
    await fetch(`/api/users/${id}`, { method: 'DELETE' });
    document.getElementById(`uitem-${id}`)?.remove();
    toast('User removed');
  } catch(e) { toast('Failed to remove user'); }
}

async function renderFormForBag(id) {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">Loading...</div>';
  try {
    const bag = await fetch(`/api/bags/${id}`).then(r => { if (!r.ok) throw r; return r.json(); });
    // Ownership check — redirect if not owner
    if (bag.user_id !== me.id) { navigateTo(''); return; }
    renderForm(bag);
  } catch(e) { main.innerHTML = '<div class="empty">Bag not found.</div>'; }
}

function renderForm(bag) {
  const isNew = !bag;
  setHeader(isNew ? 'New Bag' : 'Edit Bag', 'Bags', null);
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="section-title">${isNew ? 'New Bag' : 'Edit Bag'}</div>
    <form id="bag-form">
      <div class="field">
        <label>Name *</label>
        <input name="name" value="${esc(bag?.name || '')}" placeholder="e.g. Summer clothes" required autocomplete="off">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea name="description" placeholder="What's inside...">${esc(bag?.description || '')}</textarea>
      </div>
      <div class="field">
        <label>Location</label>
        <input name="location" value="${esc(bag?.location || '')}" placeholder="e.g. Top shelf, spare room" autocomplete="off">
      </div>
      <button type="submit" class="btn-primary" id="save-btn">${isNew ? 'Create Bag' : 'Save Changes'}</button>
    </form>
    <div id="photos-section"></div>
  `;
  if (!isNew) renderPhotosSection(bag);

  document.getElementById('bag-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    const fd = new FormData(e.target);
    const body = { name: fd.get('name'), description: fd.get('description'), location: fd.get('location') };
    try {
      if (isNew) {
        const { id } = await fetch('/api/bags', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        }).then(r => r.json());
        history.replaceState(null, '', `#edit-${id}`);
        await renderFormForBag(id);
        toast('Bag created — add some photos');
      } else {
        await fetch(`/api/bags/${bag.id}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        });
        toast('Saved');
        btn.disabled = false;
      }
    } catch(err) { toast('Error saving'); btn.disabled = false; }
  });
}

function renderPhotosSection(bag) {
  const nfcUrl = `${location.origin}/bag.html?id=${bag.id}`;
  document.getElementById('photos-section').innerHTML = `
    <div class="photos-section">
      <div class="photos-header">
        <div class="photos-title">Photos <span id="photo-count">(${bag.images.length})</span></div>
      </div>
      <div class="photo-grid" id="photo-grid">
        ${bag.images.map(img => photoHTML(img)).join('')}
      </div>
      <label class="upload-label" for="file-input">+ Add Photos</label>
      <div class="nfc-section">
        <div class="nfc-label">NFC Tag URL</div>
        <div class="nfc-url">${esc(nfcUrl)}</div>
        <button class="copy-btn" id="copy-btn" onclick="copyNFC()">Copy URL for NFC Tag</button>
        <div class="nfc-hint">Open this page using the IP/hostname you want on the tag (e.g. http://192.168.x.x:8099), then copy the URL to program your NFC sticker.</div>
      </div>
      <a href="/bag.html?id=${esc(bag.id)}" class="view-link">View bag &#8594;</a>
    </div>`;
  setupUploadHandler(bag.id);
}

function photoHTML(img) {
  return `<div class="photo-wrap" id="pw-${esc(img.id)}">
    <img src="/uploads/${esc(img.filename)}" alt="" loading="lazy">
    <button class="photo-del" onclick="deletePhoto('${esc(img.id)}')" title="Remove">&#215;</button>
  </div>`;
}

function setupUploadHandler(bagId) {
  const fi = document.getElementById('file-input');
  fi.value = '';
  fi.onchange = async () => {
    if (!fi.files.length) return;
    const fd = new FormData();
    for (const f of fi.files) fd.append('images', f);
    try {
      const newImgs = await fetch(`/api/bags/${bagId}/images`, { method: 'POST', body: fd }).then(r => r.json());
      const grid = document.getElementById('photo-grid');
      for (const img of newImgs) {
        const el = document.createElement('div');
        el.innerHTML = photoHTML(img);
        grid.appendChild(el.firstElementChild);
      }
      adjustCount(newImgs.length);
      fi.value = '';
      toast(`${newImgs.length} photo${newImgs.length !== 1 ? 's' : ''} added`);
    } catch(_) { toast('Upload failed'); }
  };
}

function adjustCount(delta) {
  const el = document.getElementById('photo-count');
  if (!el) return;
  const n = parseInt(el.textContent.replace(/\D/g,'')) || 0;
  el.textContent = `(${n + delta})`;
}

async function deletePhoto(imgId) {
  try {
    await fetch(`/api/images/${imgId}`, { method: 'DELETE' });
    document.getElementById(`pw-${imgId}`)?.remove();
    adjustCount(-1);
    toast('Photo removed');
  } catch(_) { toast('Failed to remove photo'); }
}

async function deleteBag(id, name) {
  if (!confirm(`Delete "${name}"?\n\nThis removes all photos too.`)) return;
  try {
    await fetch(`/api/bags/${id}`, { method: 'DELETE' });
    document.getElementById(`item-${id}`)?.remove();
    toast('Bag deleted');
  } catch(_) { toast('Failed to delete bag'); }
}

function copyNFC() {
  const url = document.querySelector('.nfc-url')?.textContent?.trim();
  if (!url) return;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy URL for NFC Tag'; btn.classList.remove('copied'); }, 2200);
  }).catch(() => toast('Could not copy — select manually'));
}

window.addEventListener('popstate', render);
init();
</script>
</body>
</html>
