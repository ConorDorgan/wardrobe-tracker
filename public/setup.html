<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Setup — Wardrobe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0c0c0c;--surface:#181818;--border:#2a2a2a;--accent:#5b8df6;--text:#f0f0f0;--muted:#777;--danger:#d94f4f}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:360px}
.logo{font-size:32px;font-weight:800;letter-spacing:-1px;margin-bottom:6px}
.tagline{color:var(--muted);font-size:14px;margin-bottom:8px;line-height:1.5}
.note{color:var(--muted);font-size:13px;background:rgba(91,141,246,.1);border:1px solid rgba(91,141,246,.2);border-radius:8px;padding:10px 12px;margin-bottom:24px;line-height:1.5}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--text);font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,141,246,.12)}
.error{color:var(--danger);font-size:14px;margin-bottom:12px;min-height:20px}
.btn{width:100%;padding:14px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px;transition:opacity .15s}
.btn:active{opacity:.8}
.btn:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Wardrobe</div>
  <div class="tagline">First run — create your admin account</div>
  <div class="note">This is the first account. It will have admin access to add other users later.</div>
  <form id="form" autocomplete="on">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" placeholder="e.g. conor" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Min 4 characters" required>
    </div>
    <div class="error" id="error"></div>
    <button type="submit" class="btn" id="btn">Create Account</button>
  </form>
</div>
<script>
// If users already exist, go to login
fetch('/api/setup/needed').then(r => r.json()).then(d => { if (!d.needed) location.replace('/login.html'); });
// If already logged in, go home
fetch('/api/auth/me').then(r => { if (r.ok) location.replace('/'); });

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('error');
  err.textContent = '';
  const password = document.getElementById('password').value;
  if (password.length < 4) { err.textContent = 'Password must be at least 4 characters'; return; }
  btn.disabled = true;
  btn.textContent = 'Creating...';
  try {
    const r = await fetch('/api/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('username').value, password }),
    });
    if (r.ok) {
      location.replace('/');
    } else {
      const d = await r.json();
      err.textContent = d.error || 'Setup failed';
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  } catch(_) {
    err.textContent = 'Network error — try again';
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
});
</script>
</body>
</html>
